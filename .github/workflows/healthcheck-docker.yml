name: Docker

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Automatically converts the repository path to lowercase to satisfy GHCR requirements
          images: ghcr.io/${{ github.repository }}
          tags: |
            # If triggered by a branch push, tag with branch name
            type=ref,event=branch
            # Keep a rolling raw SHA tag for unique trace-ability
            type=sha,format=short
            # Use :latest if triggered by the MAIN branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Publish
        uses: docker/build-push-action@v7
        with:
          context: healthcheck/.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
